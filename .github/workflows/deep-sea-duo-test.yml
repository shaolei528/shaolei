name: Deep Sea Duo Tests

on:
  push:
    branches:
      - feat/deep-sea-duo-v1
    paths:
      - deep-sea-duo/**
      - .github/workflows/deep-sea-duo-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-sea-duo-tests-netlify-ntfy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deep-sea-duo
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Netlify room-service dependencies
        run: npm install --package-lock=false

      - name: Run unit and regression tests
        run: npm test

      - name: Run JavaScript and function syntax checks
        run: npm run check

      - name: Verify active pairing path no longer targets Supabase
        run: |
          ! grep -n "supabase.co" src/network/signaling.js src/network/room.js src/main.js
          grep -n "SIGNAL_URL = '/room'" src/network/signaling.js
          grep -n "NTFY_BASE_URL = 'https://ntfy.sh'" src/network/signaling.js
          grep -n 'path: "/room"' netlify/functions/room.mts

      - name: Verify live ntfy signaling fallback
        run: node scripts/smoke-ntfy.mjs

      - name: Package Netlify site
        uses: actions/upload-artifact@v4
        with:
          name: deep-sea-duo-netlify
          path: |
            deep-sea-duo
            !deep-sea-duo/node_modules
          if-no-files-found: error
          retention-days: 7
