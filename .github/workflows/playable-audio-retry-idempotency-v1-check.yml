name: playable-audio-retry-idempotency-v1-check

on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'modules/audio/playable-feel-audio-v1.js'
      - 'tests/playable-audio-retry-idempotency-v1.test.mjs'
      - 'tests/playable-slice-audio-mixer-v1.test.mjs'
      - 'tests/playable-slice-atmosphere-audio-v1.test.mjs'
      - 'tests/playable-slice-feel-audio-v1.test.mjs'
      - 'tests/playable-slice-smoothness-v1.test.mjs'
      - '.github/workflows/playable-audio-retry-idempotency-v1-check.yml'
  pull_request:
    paths:
      - 'modules/audio/playable-feel-audio-v1.js'
      - 'tests/playable-audio-retry-idempotency-v1.test.mjs'
      - 'tests/playable-slice-audio-mixer-v1.test.mjs'
      - 'tests/playable-slice-atmosphere-audio-v1.test.mjs'
      - 'tests/playable-slice-feel-audio-v1.test.mjs'
      - 'tests/playable-slice-smoothness-v1.test.mjs'
      - '.github/workflows/playable-audio-retry-idempotency-v1-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audio retry re-evaluation ownership regression
        run: node tests/playable-audio-retry-idempotency-v1.test.mjs
      - name: Existing audio mixer regression
        run: node tests/playable-slice-audio-mixer-v1.test.mjs
      - name: Existing atmosphere state regression
        run: node tests/playable-slice-atmosphere-audio-v1.test.mjs
      - name: Existing playable feel audio regression
        run: node tests/playable-slice-feel-audio-v1.test.mjs
      - name: Existing smoothness audio soak regression
        run: node tests/playable-slice-smoothness-v1.test.mjs
      - name: Audio syntax
        run: node --check modules/audio/playable-feel-audio-v1.js
