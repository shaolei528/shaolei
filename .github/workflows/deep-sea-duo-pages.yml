name: Deploy Deep Sea Duo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deep-sea-duo-pages
  cancel-in-progress: true

# GitHub App connections cannot perform the repository-admin step required
# for first-time Pages enablement. Keep this workflow manual-only as a future
# fallback. The audited static build is currently tested through pinned HTTPS
# commit URLs; the Netlify project remains the intended same-origin deployment.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game files
        uses: actions/upload-pages-artifact@v4
        with:
          path: deep-sea-duo

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
