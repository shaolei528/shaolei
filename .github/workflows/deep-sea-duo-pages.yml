name: Deploy Deep Sea Duo to GitHub Pages

on:
  push:
    branches:
      - feat/deep-sea-duo-v1
    paths:
      - deep-sea-duo/**
      - .github/workflows/deep-sea-duo-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deep-sea-duo-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload game files
        uses: actions/upload-pages-artifact@v4
        with:
          path: deep-sea-duo

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
