name: cloudflare-check

on:
  push:
    paths:
      - 'cloudflare/**'
      - 'survival-v17.html'
      - 'network-relay-v16.js'
      - 'network-quality-v20.js'
      - 'smooth-motion-v18.js'
      - 'platform-inventory-v19.js'
      - 'interaction-v12.js'
      - 'content-v9.js'
      - 'regression-v14.js'
      - 'tests/motion-v18.test.mjs'
      - 'tests/platform-inventory-v19.test.mjs'
      - 'tests/interaction-v12.test.mjs'
      - 'tests/ready-localization-v9.test.mjs'
      - 'tests/network-quality-v20.test.mjs'
      - 'game-render.js'
      - 'game-play.js'
      - 'render-v9.js'
      - 'survival-config.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/cloudflare-check.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'survival-v17.html'
      - 'network-relay-v16.js'
      - 'network-quality-v20.js'
      - 'smooth-motion-v18.js'
      - 'platform-inventory-v19.js'
      - 'interaction-v12.js'
      - 'content-v9.js'
      - 'regression-v14.js'
      - 'tests/motion-v18.test.mjs'
      - 'tests/platform-inventory-v19.test.mjs'
      - 'tests/interaction-v12.test.mjs'
      - 'tests/ready-localization-v9.test.mjs'
      - 'tests/network-quality-v20.test.mjs'
      - 'game-render.js'
      - 'game-play.js'
      - 'render-v9.js'
      - 'survival-config.js'
      - 'wrangler.jsonc'
      - 'package.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Protocol test
        run: node cloudflare/test.mjs
      - name: Check relay client syntax
        run: node --check network-relay-v16.js
      - name: Check network quality syntax
        run: node --check network-quality-v20.js
      - name: Check motion pipeline syntax
        run: node --check smooth-motion-v18.js
      - name: Check cross-platform inventory syntax
        run: node --check platform-inventory-v19.js
      - name: Check interaction syntax
        run: node --check interaction-v12.js
      - name: Check content syntax
        run: node --check content-v9.js
      - name: Check UI stability syntax
        run: node --check regression-v14.js
      - name: Check gameplay/render syntax
        run: |
          node --check game-play.js
          node --check game-render.js
          node --check render-v9.js
      - name: Motion prediction regression test
        run: node tests/motion-v18.test.mjs
      - name: Cross-platform inventory regression test
        run: node tests/platform-inventory-v19.test.mjs
      - name: Interaction joystick regression test
        run: node tests/interaction-v12.test.mjs
      - name: Ready localization regression test
        run: node tests/ready-localization-v9.test.mjs
      - name: Network quality regression test
        run: node tests/network-quality-v20.test.mjs
      - name: Check V17 boot syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('survival-v17.html').read_text()
          match = re.search(r'<script>([\s\S]*?)</script>', text)
          if not match:
              raise SystemExit('V17 inline boot script not found')
          Path('/tmp/v17-boot.js').write_text(match.group(1))
          if 'smooth-motion-v18.js' not in text:
              raise SystemExit('V17 motion module missing')
          if 'platform-inventory-v19.js' not in text:
              raise SystemExit('V17 platform inventory module missing')
          if 'interaction-v12.js' not in text:
              raise SystemExit('V17 interaction module missing')
          if 'content-v9.js' not in text:
              raise SystemExit('V17 content module missing')
          if 'network-quality-v20.js' not in text:
              raise SystemExit('V17 network quality module missing')
          if "const VER='17h'" not in text:
              raise SystemExit('V17h cache key missing')
          PY
          node --check /tmp/v17-boot.js
      - name: Check motion invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('smooth-motion-v18.js').read_text()
          required = [
            "mode:'client-prediction'",
            "authority:'client-position'",
            "remoteInterpolation:'snapshot-buffer'",
            'baseUpdate(dt)',
            'camera.x=me.x',
            'camera.y=me.y',
            'legacyTicksBlocked',
            'REMOTE_DELAY_MS=100',
            'baseOnMove(payload)'
          ]
          missing = [item for item in required if item not in text]
          if missing:
            raise SystemExit('motion invariant missing: ' + ', '.join(missing))
          PY
      - name: Validate root Worker bundle
        run: |
          npm install
          npm run check:worker
      - name: External production health check
        run: |
          set -euxo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/health.txt -w '%{http_code}' --connect-timeout 10 --max-time 20 \
              -H 'Accept: application/json' \
              https://abyssal-wake-relay.zuoranzhang.workers.dev/health || true)
            echo "attempt=$i http=$code body=$(cat /tmp/health.txt 2>/dev/null || true)"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/health.txt; then
              exit 0
            fi
            sleep 10
          done
          echo 'Cloudflare production endpoint is still not serving the expected Worker.' >&2
          exit 1
      - name: Live two-client multiplayer test
        env:
          LIVE_RELAY_URL: wss://abyssal-wake-relay.zuoranzhang.workers.dev/ws
        run: npm run test:live-relay
