name: cloudflare-check

on:
  push:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-check.yml'
  pull_request:
    paths:
      - 'cloudflare/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Protocol test
        run: node cloudflare/test.mjs
      - name: Install Cloudflare toolchain
        working-directory: cloudflare
        run: npm install
      - name: Validate Worker bundle
        working-directory: cloudflare
        run: npm run check
