<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17382f">
<title>Abyssal Wake — V10</title>
<style>
html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#07110f;color:#dce9e1;font:700 11px ui-monospace,monospace}.boot{padding:18px;border:1px solid #607b6e;background:#0d1b17;text-align:center;line-height:1.7;max-width:82%}.boot small{color:#a9bbb2;font-weight:500}
</style>
</head>
<body>
<div class="boot" id="v10Boot">LOADING MIREWOOD UI…<br><small>Preparing the existing multiplayer game.</small></div>
<script>
(()=>{
  'use strict';

  const BOOT = {
    uiReady:false,
    depsReady:false,
    depsLoading:false,
    requested:false,
    promise:null,
    lastPointerUpAt:0,
    timeoutMs:8000
  };
  window.ABYSSAL_BOOT_V10 = BOOT;

  const v10Boot = document.getElementById('v10Boot');

  function failScreen(text){
    if(v10Boot){
      v10Boot.innerHTML = text + '<br><small>Reload once. If it repeats, send a screenshot.</small>';
    }
  }

  function loadScript(src, timeoutMs=BOOT.timeoutMs){
    return new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      let settled=false;
      const timer=setTimeout(()=>finish(false,new Error('timeout: '+src)),timeoutMs);
      function finish(ok,value){
        if(settled)return;
        settled=true;
        clearTimeout(timer);
        script.onload=null;
        script.onerror=null;
        if(ok)resolve(value);
        else{script.remove();reject(value);}
      }
      script.src=src;
      script.async=false;
      script.onload=()=>finish(true,src);
      script.onerror=()=>finish(false,new Error('failed: '+src));
      document.head.appendChild(script);
    });
  }

  async function loadRealtime(){
    if(window.supabase?.createClient)return;
    const mirrors=[
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4',
      'https://unpkg.com/@supabase/supabase-js@2.57.4'
    ];
    let lastError=null;
    for(const src of mirrors){
      try{
        setStatus('Connecting shared-world services…');
        await loadScript(src,8000);
        if(window.supabase?.createClient)return;
      }catch(error){
        lastError=error;
      }
    }
    throw lastError||new Error('Realtime client unavailable');
  }

  function setStatus(text,error=false){
    const setup=document.getElementById('setup');
    if(!setup)return;
    setup.classList.remove('hidden');
    setup.textContent=text;
    setup.style.color=error?'#efb1aa':'';
  }

  function setEnterBusy(busy){
    const enter=document.getElementById('enter');
    if(!enter)return;
    if(!enter.dataset.v10Label)enter.dataset.v10Label=enter.textContent;
    enter.disabled=!!busy;
    enter.textContent=busy?'ENTERING MIREWOOD…':enter.dataset.v10Label;
    enter.style.opacity=busy?'.78':'';
  }

  let enter=null;
  let nameInput=null;

  function removeEntryInterceptors(){
    if(!enter)return;
    enter.removeEventListener('pointerup',interceptPointerUp,true);
    enter.removeEventListener('click',interceptClick,true);
    nameInput?.removeEventListener('keydown',interceptKeyDown,true);
  }

  function handOffToExistingGame(){
    if(!BOOT.depsReady)return;
    removeEntryInterceptors();
    setEnterBusy(false);
    const setup=document.getElementById('setup');
    if(setup)setup.classList.add('hidden');
    if(BOOT.requested){
      BOOT.requested=false;
      queueMicrotask(()=>enter?.click());
    }
  }

  async function loadExistingModules(){
    if(BOOT.depsReady)return true;
    if(BOOT.promise)return BOOT.promise;

    BOOT.promise=(async()=>{
      BOOT.depsLoading=true;
      try{
        if(!window.ABYSSAL_CONFIG){
          await loadScript('./survival-config.js?v=10',5000);
        }
        await loadRealtime();

        const files=[
          './game-core.js?v=10',
          './game-play.js?v=10',
          './game-render.js?v=10',
          './game-v7-patch.js?v=10',
          './mobile-fixes.js?v=10',
          './network-v9.js?v=10',
          './gameplay-v9.js?v=10',
          './content-v9.js?v=10',
          './render-v9.js?v=10',
          './optimize-v9.js?v=10'
        ];

        for(const file of files){
          setStatus('Loading Mirewood systems…');
          await loadScript(file,8000);
        }

        BOOT.depsReady=true;
        BOOT.depsLoading=false;
        BOOT.promise=null;
        handOffToExistingGame();
        return true;
      }catch(error){
        console.error('[Abyssal V10 boot]',error);
        BOOT.depsReady=false;
        BOOT.depsLoading=false;
        BOOT.promise=null;
        BOOT.requested=false;
        setEnterBusy(false);
        setStatus('Shared world failed to load. Tap ENTER SAFE CAMP to retry.',true);
        return false;
      }
    })();

    return BOOT.promise;
  }

  function requestEntry(event){
    if(BOOT.depsReady)return;
    event?.preventDefault?.();
    event?.stopImmediatePropagation?.();
    BOOT.requested=true;
    setEnterBusy(true);
    setStatus(BOOT.depsLoading?'Loading Mirewood systems…':'Preparing Safe Camp…');
    loadExistingModules();
  }

  function interceptPointerUp(event){
    BOOT.lastPointerUpAt=performance.now();
    requestEntry(event);
  }
  function interceptClick(event){
    if(performance.now()-BOOT.lastPointerUpAt<650){
      if(!BOOT.depsReady){
        event.preventDefault();
        event.stopImmediatePropagation();
      }
      return;
    }
    requestEntry(event);
  }
  function interceptKeyDown(event){
    if(event.key==='Enter')requestEntry(event);
  }

  async function mountExistingUI(){
    try{
      const response=await fetch('./survival-v7.html?ui=10',{cache:'no-store'});
      if(!response.ok)throw new Error('survival-v7.html '+response.status);
      const source=await response.text();
      const parsed=new DOMParser().parseFromString(source,'text/html');

      parsed.querySelectorAll('script').forEach(node=>node.remove());

      document.head.querySelectorAll('style[data-v10-old]').forEach(node=>node.remove());
      const currentStyles=[...document.head.querySelectorAll('style')];
      currentStyles.forEach(style=>style.setAttribute('data-v10-old','1'));

      for(const style of parsed.head.querySelectorAll('style')){
        document.head.appendChild(style.cloneNode(true));
      }

      document.body.innerHTML=parsed.body.innerHTML;

      enter=document.getElementById('enter');
      nameInput=document.getElementById('name');
      const gate=document.getElementById('gate');
      if(!enter||!gate)throw new Error('entry DOM missing after UI mount');

      BOOT.uiReady=true;

      enter.addEventListener('pointerup',interceptPointerUp,{capture:true,passive:false});
      enter.addEventListener('click',interceptClick,{capture:true,passive:false});
      nameInput?.addEventListener('keydown',interceptKeyDown,{capture:true});

      setTimeout(()=>{
        if(!BOOT.depsReady&&!BOOT.depsLoading)loadExistingModules();
      },400);

    }catch(error){
      console.error('[Abyssal V10 UI]',error);
      failScreen('MIREWOOD UI FAILED TO LOAD');
    }
  }

  mountExistingUI();
})();
</script>
</body>
</html>
