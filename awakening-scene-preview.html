<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRE MART · 场景接线检查</title>
<style>body{margin:20px;background:#131d22;color:#d8e5e6;font:15px system-ui}a{color:#a7dcca;margin-right:20px}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;border:1px solid #64777d;margin-top:16px}label,select{margin-right:20px}table{border-collapse:collapse;margin-top:16px}td,th{padding:6px 12px;border-bottom:1px solid #34474d;text-align:left}.note{color:#efce8d}</style>
<h1>MIRE MART · 原图摆位检查</h1>
<p class="note">开发检查页，不是正式美术。复用游戏实际加载器和世界绘制代码；不联网、不读写存档。图片原尺寸显示，不拉伸。</p>
<p><a href="?awArtPreview=1">G 原图预览</a><a href="?awArtPreview=0">默认 fallback 对照</a><a href="survival-v21.html?awArtPreview=1">进入实际游戏</a></p>
<label>视角 <select id="view"><option value="store">便利店与停车场</option><option value="road">北路</option></select></label>
<label><input id="outlines" type="checkbox" checked>显示碰撞范围（金色）与 prop 底部锚点（青色）</label>
<p id="status" role="status">正在加载…</p>
<canvas id="scene" width="960" height="768" aria-label="实际世界绘制的 MIRE MART 场景"></canvas>
<p>碰撞范围不是图片缩放目标。两者差异需要人工判断；小图不能让实际障碍变成看不见的墙。</p>
<table><thead><tr><th>实际摆位</th><th>语义</th><th>原图尺寸</th><th>摆位范围</th><th>渲染来源</th></tr></thead><tbody id="placements"></tbody></table>
<script>
var canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),camera={x:2432,y:1000},inventory={shard:0},currentZone='1:0';
window.sx=x=>Math.round(x-camera.x+canvas.width/2);
window.sy=y=>Math.round(y-camera.y+canvas.height/2);
window.drawGround=()=>{ctx.fillStyle='#243335';ctx.fillRect(0,0,canvas.width,canvas.height);};
window.drawCamp=()=>{};
window.drawLighting=()=>{};
</script>
<script src="modules/world/world-spatial-v1.js"></script>
<script src="modules/render/awakening-art-assets-v1.js"></script>
<script src="modules/world/awakening-world-v1.js"></script>
<script>
const art=window.ABYSSAL_AWAKENING_ART_V1,world=window.ABYSSAL_AWAKENING_WORLD_V1;
document.getElementById('view').onchange=event=>{camera.y=event.target.value==='road'?1696:1000;};
function render(){
  ctx.imageSmoothingEnabled=false;
  window.drawGround(canvas.width,canvas.height);
  window.drawCamp(canvas.width,canvas.height);
  window.drawLighting(canvas.width,canvas.height);
  if(document.getElementById('outlines').checked){
    ctx.save();ctx.strokeStyle='#edc16e';ctx.lineWidth=1;
    for(const p of world.layers.collision)ctx.strokeRect(sx(p.x)+.5,sy(p.y)+.5,p.w,p.h);
    ctx.strokeStyle='#79e5d5';
    for(const p of [...world.layers.props,world.sign]){const x=sx(p.x+p.w/2),y=sy(p.y+p.h);ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);ctx.stroke();}
    ctx.restore();
  }
  requestAnimationFrame(render);
}
art.load().then(()=>{
  document.getElementById('status').textContent=`${art.previewMode?'原图预览':'默认模式'} · ${art.status()} · ${art.state.images.size}/${new Set([...art.state.assets.values()].map(a=>a.file)).size} 图片 · ${art.reason()||'已加载'}（terrain / debris / FX 仍可能为 fallback）`;
  for(const [category,list] of [['prop',[...world.layers.props,world.sign]],['decal',world.layers.decals],['fx',world.layers.fx]])for(const p of list){
    const entry=art.pick(category,p.kind,0),row=document.createElement('tr');
    for(const value of [p.id,`${category}.${p.kind}`,entry?`${entry.width}×${entry.height}`:'—',`${p.w}×${p.h}`,entry?(art.previewMode&&category==='prop'&&p!==world.sign?'PNG + 障碍底图':'PNG'):'fallback']){const cell=document.createElement('td');cell.textContent=value;row.appendChild(cell);}
    document.getElementById('placements').appendChild(row);
  }
});
render();
</script>
</html>
