<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b2b" />
    <title>深海搭档 / Deep Sea Duo</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="game" aria-label="深海搭档游戏画面"></canvas>
      <section id="room-panel" class="room-panel"><h1>深海搭档</h1><p id="room-status">局域网双人直连</p><div><button id="create-room">创建房间</button><button id="join-room">加入房间</button></div><textarea id="room-code" placeholder="这里会显示或粘贴连接码"></textarea><button id="room-action" class="is-hidden">确认连接</button><small>首次配对：房主码 → 加入者应答码 → 房主确认</small></section>
      <section id="hud" class="hud" aria-live="polite"></section>
      <section id="upgrade-panel" class="upgrade-panel is-hidden" aria-label="选择强化"></section>
      <button id="dash-button" class="dash-button" type="button" aria-label="冲刺">冲刺</button>
      <section class="touch-hint" aria-hidden="true">
        <span>左侧移动</span><span>右侧拖动瞄准</span>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
