<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b2b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="深海搭档" />
    <title>深海搭档 / Deep Sea Duo</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="game" aria-label="深海搭档游戏画面"></canvas>

      <section id="room-panel" class="room-panel">
        <div class="room-card">
          <div class="logo-orb" aria-hidden="true"><span>◉</span></div>
          <h1 data-i18n="gameTitle">深海搭档</h1>
          <p id="room-status" aria-live="polite" data-i18n="roomLan">局域网 / 热点双人直连</p>

          <div id="lobby-actions" class="room-buttons">
            <button id="create-room" data-i18n="createRoom">创建房间</button>
            <button id="join-room" data-i18n="joinRoom">加入房间</button>
          </div>

          <section id="host-room-view" class="quick-room-view is-hidden" aria-live="polite">
            <small data-i18n="yourRoomCode">你的房间码</small>
            <strong id="host-room-code" class="room-code-display">------</strong>
            <span data-i18n="tellFriendCode">把这 6 位数字告诉朋友即可</span>
          </section>

          <section id="join-room-view" class="quick-room-view is-hidden">
            <label for="quick-room-code" data-i18n="enterRoomCode">输入朋友的 6 位房间码</label>
            <input id="quick-room-code" class="room-code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000000" aria-label="6 digit room code" />
            <button id="quick-join" type="button" disabled data-i18n="connectRoom">连接房间</button>
          </section>

          <button id="retry-room" class="retry-button is-hidden" type="button" data-i18n="backToLobby">返回大厅</button>

          <small class="network-tip" data-i18n="roomSameNetwork">两台手机连接同一个 Wi‑Fi，或一台开热点让另一台连接。</small>
          <small data-i18n="quickPairHint">正常情况只需要 6 位房间码，不需要复制长连接码。</small>

          <details class="manual-fallback">
            <summary data-i18n="manualFallbackTitle">高级备用：无网时手动连接</summary>
            <div class="manual-fallback-body">
              <small data-i18n="manualFallbackHint">只有信令服务不可用、但两台手机仍在同一局域网时才需要这里。</small>
              <div class="room-buttons">
                <button id="manual-create" type="button" data-i18n="manualCreate">生成房主长码</button>
                <button id="manual-join" type="button" data-i18n="manualJoin">使用房主长码</button>
              </div>
              <textarea id="manual-code" data-i18n-placeholder="manualCodePlaceholder" placeholder="高级备用连接码" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
              <button id="manual-action" class="is-hidden" type="button" data-i18n="manualContinue">继续手动连接</button>
            </div>
          </details>
        </div>
      </section>

      <section id="hud" class="hud" aria-live="polite"></section>

      <nav class="utility-bar" aria-label="Game settings">
        <button id="language-button" type="button">EN</button>
        <button id="audio-button" type="button">声音 开</button>
      </nav>

      <section id="upgrade-panel" class="upgrade-panel is-hidden" aria-label="选择强化"></section>
      <button id="dash-button" class="dash-button" type="button" data-i18n="dash" data-i18n-aria="dash">冲刺</button>

      <section class="touch-hint" aria-hidden="true">
        <span data-i18n="moveHint">左侧滑动移动</span>
        <span data-i18n="aimHint">右侧拖动瞄准并发射</span>
      </section>

      <aside class="rotate-notice" aria-live="polite">
        <div class="phone-icon" aria-hidden="true">↻</div>
        <strong data-i18n="rotateTitle">横屏体验更好</strong>
        <span data-i18n="rotateBody">请把手机转成横屏，再继续深海冒险。</span>
      </aside>
    </main>
    <script type="module" src="./src/pwa.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
