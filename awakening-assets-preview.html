<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awakening Art Pack Preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11171a;color:#dfe8e6;font:13px ui-monospace,monospace}header{position:sticky;top:0;z-index:2;padding:14px 18px;background:#0b1012eF;border-bottom:1px solid #334147}h1{margin:0 0 7px;font-size:16px}.muted{color:#91a2a3}.status{margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px}.card{border:1px solid #354247;background:#172024;padding:10px;overflow:auto}.title{font-weight:800;overflow-wrap:anywhere}.meta{color:#93a7a8;margin:5px 0 8px}.checker{display:inline-block;padding:8px;background-color:#899496;background-image:linear-gradient(45deg,#657073 25%,transparent 25%),linear-gradient(-45deg,#657073 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#657073 75%),linear-gradient(-45deg,transparent 75%,#657073 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}.checker canvas{display:block;image-rendering:pixelated}.scale{width:min(100%,384px);height:auto}.warning{color:#f0c77a}.error{color:#f09b91}.pass{color:#9bd6ae}.seam{margin-top:8px}button{font:inherit;background:#243239;color:#e7efec;border:1px solid #53676e;padding:7px 10px}
</style></head>
<body>
<header><h1>ABYSSAL WAKE · Awakening World Art Pack Preview</h1><div class="muted">Dev-only · nearest-neighbor · alpha checkerboard · terrain 3×3 seam repeat</div><div id="status" class="status">Loading <code>assets/awakening-v1/manifest.json</code>…</div></header>
<main id="grid" class="grid"></main>
<script>
(()=>{'use strict';
const ROOT='assets/awakening-v1/';const status=document.getElementById('status'),grid=document.getElementById('grid');
function normalize(m){const assets=Array.isArray(m.assets)?m.assets.map(a=>({...a})):[];for(const s of Array.isArray(m.sheets)?m.sheets:[]){const cw=Number(s.cellWidth),ch=Number(s.cellHeight);for(const e of Array.isArray(s.entries)?s.entries:[]){const direct=[e.x,e.y,e.w,e.h].every(Number.isFinite),cols=Number.isInteger(e.cols)&&e.cols>0?e.cols:1,rows=Number.isInteger(e.rows)&&e.rows>0?e.rows:1,sourceRect=direct?{x:+e.x,y:+e.y,w:+e.w,h:+e.h}:{x:+(e.col||0)*cw,y:+(e.row||0)*ch,w:cols*cw,h:rows*ch};assets.push({...e,file:e.file||s.file,sourceRect,width:e.width||sourceRect.w,height:e.height||sourceRect.h});}}return{...m,assets};}
function loadImage(file){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('failed '+file));image.src=ROOT+file+'?preview='+Date.now();});}
function sourceOf(asset,image){return asset.sourceRect||{x:0,y:0,w:image.naturalWidth,h:image.naturalHeight};}
function makeCanvas(w,h,cssScale=1){const c=document.createElement('canvas');c.width=w;c.height=h;c.style.width=(w*cssScale)+'px';c.style.height=(h*cssScale)+'px';return c;}
function drawSource(canvas,image,src,repeat=false){const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;if(repeat){for(let y=0;y<3;y++)for(let x=0;x<3;x++)c.drawImage(image,src.x,src.y,src.w,src.h,x*src.w,y*src.h,src.w,src.h);}else c.drawImage(image,src.x,src.y,src.w,src.h,0,0,canvas.width,canvas.height);}
async function card(asset){const el=document.createElement('section');el.className='card';el.innerHTML=`<div class="title">${asset.id||'&lt;missing id&gt;'}</div><div class="meta">${asset.category||'?'} · ${asset.file||'?'} </div>`;try{const image=await loadImage(asset.file),src=sourceOf(asset,image),declared=`${asset.width||src.w}×${asset.height||src.h}`,actual=`${src.w}×${src.h}`;el.querySelector('.meta').textContent+=`· source ${actual} · declared ${declared}`;const box=document.createElement('div');box.className='checker';const c=makeCanvas(src.w,src.h,Math.max(1,Math.min(3,Math.floor(192/Math.max(src.w,src.h)))));drawSource(c,image,src);box.appendChild(c);el.appendChild(box);if(asset.category==='terrain'){const seam=document.createElement('div');seam.className='checker seam';const s=makeCanvas(src.w*3,src.h*3,1);s.className='scale';drawSource(s,image,src,true);seam.appendChild(s);el.appendChild(seam);if(src.w%64||src.h%64){const w=document.createElement('div');w.className='error';w.textContent='Terrain source is not a 64px multiple.';el.appendChild(w);}}}catch(error){const e=document.createElement('div');e.className='error';e.textContent=error.message;el.appendChild(e);}return el;}
(async()=>{let response;try{response=await fetch(ROOT+'manifest.json',{cache:'no-store'});}catch(error){status.className='status error';status.textContent='Manifest request failed: '+error.message;return;}if(!response.ok){status.className='status warning';status.innerHTML='No production manifest yet. Placeholder fallback remains active. Add <code>assets/awakening-v1/manifest.json</code> when Art Pack 01 arrives.';return;}let manifest;try{manifest=normalize(await response.json());}catch(error){status.className='status error';status.textContent='Invalid manifest JSON: '+error.message;return;}status.className='status pass';status.textContent=`Loaded ${manifest.assets.length} asset entries. Inspect at native/nearest-neighbor scale.`;for(const asset of manifest.assets)grid.appendChild(await card(asset));})();
})();
</script></body></html>
