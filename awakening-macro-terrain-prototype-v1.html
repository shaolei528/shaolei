<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Awakening Macro Terrain Prototype V1</title><style>html,body{margin:0;background:#101518;color:#d7e0df;font:12px monospace}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{font:inherit;padding:6px 10px}canvas{display:block;margin:auto;image-rendering:pixelated;background:#263337;max-width:100%;height:auto}.note{padding:8px 12px;color:#aab8b8}</style></head><body><header><strong>Macro Terrain A/B/C</strong><button data-mode="A">A · 64×64 base</button><button data-mode="B">B · macro only</button><button data-mode="C">C · base + macro detail</button><button id="pc">PC 1280×720</button><button id="mobile">Mobile 390×844</button><span id="stats"></span></header><canvas id="c" width="1280" height="720"></canvas><div class="note">Presentation-only benchmark. S03/S04/S05 source images are intentionally not fabricated: when supplied, set their URLs in PATCHES below. Until then B/C expose the capability and fallback behavior without pretending the references exist in this repository.</div><script src="./modules/render/awakening-macro-terrain-prototype-v1.js"></script><script>
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),api=window.ABYSSAL_MACRO_TERRAIN_PROTOTYPE_V1;ctx.imageSmoothingEnabled=false;
const camera={x:2432,y:1408};let mode='C',last=performance.now(),fpsSamples=[];
const PATCHES=[
{id:'S03-3x3',x:2176,y:1216,cells:3,src:'assets/awakening-v1/reference/S03.png',detail:true},
{id:'S04-4x4',x:2368,y:1088,cells:4,src:'assets/awakening-v1/reference/S04.png',detail:true},
{id:'S05-6x6',x:1984,y:1472,cells:6,src:'assets/awakening-v1/reference/S05.png',detail:true}
];api.setPatches(PATCHES);
function hash(x,y){let n=Math.imul(x,374761393)+Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return(n>>>0)/4294967295;}
function baseTerrain(){const ts=64,minX=Math.floor((camera.x-canvas.width/2)/ts),maxX=Math.ceil((camera.x+canvas.width/2)/ts),minY=Math.floor((camera.y-canvas.height/2)/ts),maxY=Math.ceil((camera.y+canvas.height/2)/ts);for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){const wx=x*ts,wy=y*ts,h=hash(x,y),road=Math.abs(wx+32-2432)<150;ctx.fillStyle=road?(h>.5?'#454e51':'#3d474a'):(h>.5?'#52655d':'#485c54');ctx.fillRect(Math.round(wx-camera.x+canvas.width/2),Math.round(wy-camera.y+canvas.height/2),ts,ts);api.state.stats.drawCalls++;}}
function macroFallback(){for(const p of api.visiblePatches(camera,canvas.width,canvas.height)){const x=Math.round(p.x-camera.x+canvas.width/2),y=Math.round(p.y-camera.y+canvas.height/2);ctx.fillStyle=p.id.includes('S04')?'#3d4a4d':p.id.includes('S05')?'#50615a':'#465953';ctx.fillRect(x,y,p.w,p.h);api.state.stats.drawCalls++;}}
function frame(now){api.beginFrame(now);ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);if(mode!=='B')baseTerrain();const r=api.render({ctx,camera,W:canvas.width,H:canvas.height,mode});if(mode==='B'&&r.drawn===0)macroFallback();if(mode==='C'&&r.drawn===0){ctx.save();ctx.globalAlpha=.18;macroFallback();ctx.restore();}const s=api.endFrame(performance.now()),dt=now-last;last=now;if(dt>0){fpsSamples.push(1000/dt);if(fpsSamples.length>240)fpsSamples.shift();}const fps=fpsSamples.length?fpsSamples.reduce((a,b)=>a+b,0)/fpsSamples.length:0;document.getElementById('stats').textContent=`${mode} | draw ${s.drawCalls} | FPS ${fps.toFixed(1)} | avg ${s.avgMs.toFixed(2)}ms | p95 ${s.p95Ms.toFixed(2)}ms | ${canvas.width}×${canvas.height}`;requestAnimationFrame(frame)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>mode=b.dataset.mode);document.getElementById('pc').onclick=()=>{canvas.width=1280;canvas.height=720;ctx.imageSmoothingEnabled=false};document.getElementById('mobile').onclick=()=>{canvas.width=390;canvas.height=844;ctx.imageSmoothingEnabled=false};requestAnimationFrame(frame);
</script></body></html>
