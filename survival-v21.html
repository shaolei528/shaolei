<style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#07110f;color:#dce9e1;font:700 11px ui-monospace,monospace}.boot{padding:18px;border:1px solid #607b6e;background:#0d1b17;text-align:center;line-height:1.7;max-width:82%}.boot small{color:#a9bbb2;font-weight:500}</style></head>
<body>
<div class="boot" id="boot">正在加载高质量安全营地…<br><small>64×64 像素地表 · 独立碰撞层 · 公网多人世界。</small></div>
<script>
let connectGlobal=async()=>null,switchZone=async()=>null;
(()=>{
'use strict';
const VER='21g';
const BOOT={depsReady:false,depsLoading:false,requested:false,promise:null,lastPointerUpAt:0,timeoutMs:8000,loadedModules:new Set()};
const successor34=new URLSearchParams(globalThis.location?.search||'').get('awView')==='34';
if(successor34){window.AW_DEV_QA=false;window.AW_SUCCESSOR_PREVIEW=false;window.AW_SUCCESSOR_VIEW='34';window.AW_SUCCESSOR_PIXEL_SURVIVOR=false;window.AW_SUCCESSOR_LIVE_GROUND_ART=false;window.AW_SUCCESSOR_COZY_PIXEL_PROOF=true;window.AW_SUCCESSOR_GRAYBOX_CONTINUITY=true;}
window.ABYSSAL_BOOT_V21=BOOT;
const boot=document.getElementById('boot');
let enter=null,nameInput=null;
function failScreen(text){if(boot)boot.innerHTML=text+'<br><small>请重新载入一次；如果仍失败，把截图发给我。</small>';}
function loadScript(src,timeoutMs=BOOT.timeoutMs){return new Promise((resolve,reject)=>{const s=document.createElement('script');let settled=false;const timer=setTimeout(()=>done(false,new Error('timeout: '+src)),timeoutMs);function done(ok,value){if(settled)return;settled=true;clearTimeout(timer);s.onload=s.onerror=null;if(ok)resolve(value);else{s.remove();reject(value);}}s.src=src;s.async=false;s.onload=()=>done(true,src);s.onerror=()=>done(false,new Error('failed: '+src));document.head.appendChild(s);});}
function loadModule(name){if(BOOT.loadedModules.has(name))return Promise.resolve(name);return loadScript('./'+name+'?v='+VER,8000).then(value=>{BOOT.loadedModules.add(name);return value;});}
function setStatus(text,error=false){const el=document.getElementById('setup');if(!el)return;el.classList.remove('hidden');el.textContent=text;el.style.color=error?'#efb1aa':'';}
function setEnterBusy(busy){const el=document.getElementById('enter');if(!el)return;if(!el.dataset.v21Label)el.dataset.v21Label=el.textContent;el.disabled=!!busy;el.textContent=busy?'正在进入营地…':el.dataset.v21Label;el.style.opacity=busy?'.78':'';}
async function ensureRealtime(){if(!window.ABYSSAL_CONFIG?.RELAY_URL)throw new Error('Cloudflare relay URL is not configured');setStatus('正在准备公网多人中继…');}
function removeInterceptors(){if(!enter)return;enter.removeEventListener('pointerup',onPointer,true);enter.removeEventListener('click',onClick,true);nameInput?.removeEventListener('keydown',onKey,true);}
function handoff(){if(!BOOT.depsReady)return;removeInterceptors();setEnterBusy(false);document.getElementById('setup')?.classList.add('hidden');if(BOOT.requested){BOOT.requested=false;queueMicrotask(()=>enter?.click());}}
function loadModules(){if(BOOT.depsReady)return Promise.resolve(true);if(BOOT.promise)return BOOT.promise;BOOT.promise=(async()=>{BOOT.depsLoading=true;try{if(!window.ABYSSAL_CONFIG)await loadScript('./survival-config.js?v='+VER,5000);await ensureRealtime();const [chestConfigResponse,craftingConfigResponse,creatureRewardsConfigResponse]=await Promise.all([fetch('./data/loot/shared-chest-v1.json?v='+VER,{cache:'no-store'}),fetch('./data/crafting/recipes-v1.json?v='+VER,{cache:'no-store'}),fetch('./data/loot/creature-rewards-v1.json?v='+VER,{cache:'no-store'})]);if(!chestConfigResponse.ok)throw new Error('Shared chest data unavailable');if(!craftingConfigResponse.ok)throw new Error('Crafting recipe data unavailable');window.ABYSSAL_SHARED_CHEST_CONFIG_V1=await chestConfigResponse.json();if(!creatureRewardsConfigResponse.ok)throw new Error('Creature reward data unavailable');window.ABYSSAL_CREATURE_REWARDS_CONFIG_V1=await creatureRewardsConfigResponse.json();window.ABYSSAL_CRAFTING_RECIPES_V1=await craftingConfigResponse.json();const bossConfigResponse=await fetch('./data/world/boss-encounters-v1.json?v='+VER,{cache:'no-store'});if(!bossConfigResponse.ok)throw new Error('Boss encounter data unavailable');window.ABYSSAL_BOSS_CONFIG_V1=await bossConfigResponse.json();const farmConfigResponse=await fetch('./data/farming/crops-v1.json?v='+VER,{cache:'no-store'});if(!farmConfigResponse.ok)throw new Error('Farming crop data unavailable');window.ABYSSAL_FARMING_CONFIG_V1=await farmConfigResponse.json();const livestockConfigResponse=await fetch('./data/farming/livestock-v1.json?v='+VER,{cache:'no-store'});if(!livestockConfigResponse.ok)throw new Error('Livestock data unavailable');window.ABYSSAL_LIVESTOCK_CONFIG_V1=await livestockConfigResponse.json();const fishingConfigResponse=await fetch('./data/fishing/fish-v1.json?v='+VER,{cache:'no-store'});if(!fishingConfigResponse.ok)throw new Error('Fishing data unavailable');window.ABYSSAL_FISHING_CONFIG_V1=await fishingConfigResponse.json();const cookingConfigResponse=await fetch('./data/cooking/recipes-v1.json?v='+VER,{cache:'no-store'});if(!cookingConfigResponse.ok)throw new Error('Cooking recipe data unavailable');window.ABYSSAL_COOKING_CONFIG_V1=await cookingConfigResponse.json();const petConfigResponse=await fetch('./data/pets/companions-v1.json?v='+VER,{cache:'no-store'});if(!petConfigResponse.ok)throw new Error('Companion data unavailable');window.ABYSSAL_PETS_CONFIG_V1=await petConfigResponse.json();const socialConfigResponse=await fetch('./data/social/npc-relationships-v1.json?v='+VER,{cache:'no-store'});if(!socialConfigResponse.ok)throw new Error('NPC social data unavailable');window.ABYSSAL_NPC_SOCIAL_CONFIG_V1=await socialConfigResponse.json();const buildingConfigResponse=await fetch('./data/building/structures-v1.json?v='+VER,{cache:'no-store'});if(!buildingConfigResponse.ok)throw new Error('Building structure data unavailable');window.ABYSSAL_BUILDING_CONFIG_V1=await buildingConfigResponse.json();const waterBodiesConfigResponse=await fetch('./data/world/water-bodies-v1.json?v='+VER,{cache:'no-store'});if(!waterBodiesConfigResponse.ok)throw new Error('World water data unavailable');window.ABYSSAL_WATER_BODIES_CONFIG_V1=await waterBodiesConfigResponse.json();const files=['modules/core/runtime-state.js','modules/core/save-extensions-v1.js','modules/items/inventory-transactions-v1.js','modules/ui/base-ui.js','modules/world/world-state.js','modules/world/world-spatial-v1.js','modules/world/water-bodies-v1.js','modules/network/session-zone.js','modules/network/inbound-events.js','modules/loot/creature-rewards-v1.js','modules/survival/hurt-grace-v1.js','modules/network/outbound-sync.js','modules/network/chat-sync.js','modules/safe-camp/base-interactions.js','modules/combat/player-combat.js','modules/survival/lifecycle.js','modules/input/joystick.js','modules/survival/status.js','modules/survival/needs-consumption-v1.js','modules/main-loop/simulation-update.js','modules/combat/mob-combat.js','modules/survival/day-night.js','modules/render/base-renderer.js','modules/main-loop/legacy-scheduler.js','modules/safe-camp/game-v7-patch.js','modules/input/mobile-fixes.js','modules/network/network-v9.js','modules/survival/gameplay-v9.js','modules/safe-camp/content-v9.js','modules/network/player-activity-state-v1.js','terrain-v21.js','modules/render/render-v9.js','modules/core/optimize-v9.js','modules/loot/shared-chest-v1.js','modules/ui/ux-cn-v11.js','modules/input/interaction-v12.js','modules/input/platform-inventory-v19.js','modules/network/network-relay-v16.js','modules/network/network-quality-v20.js','modules/render/awakening-art-assets-v1.js','modules/world/awakening-world-v1.js','modules/world/awakening-expedition-loop-v1.js','modules/world/expedition-loot-bridge-v1.js','modules/safe-camp/home-workbench-upgrade-v1.js','modules/crafting/crafting-processing-v1.js','modules/main-loop/smooth-motion-v18.js','modules/ui/regression-v14.js','modules/ui/game-shell-v1.js','modules/combat/hit-feedback.js','modules/combat/weapon-presentation-v1.js','modules/combat/playable-feel-v1.js','modules/presentation/gameplay-particles-v1.js','modules/audio/playable-feel-audio-v1.js','modules/core/dev-performance-v1.js','modules/combat/boss-combat-v1.js','modules/world/boss-progression-v1.js','modules/farming/farming-v1.js','modules/render/farm-plot-render-v1.js','modules/farming/livestock-v1.js','modules/render/livestock-render-v1.js','modules/fishing/fishing-v1.js','modules/render/fishing-render-v1.js','modules/cooking/cooking-v1.js','modules/survival/food-effects-v1.js','modules/ui/cooking-panel-v1.js','modules/pets/companions-v1.js','modules/render/companion-pet-render-v1.js','modules/ui/pet-companion-panel-v1.js','modules/social/npc-social-v1.js','modules/ui/npc-social-panel-v1.js','modules/home/home-building-v1.js','modules/network/camp-world-sync-v1.js'];for(const name of files){if(BOOT.loadedModules.has(name))continue;if(successor34&&name==='modules/main-loop/smooth-motion-v18.js'){started=true;zoneConnected=true;draw=()=>{};}setStatus('正在加载游戏系统…');await loadModule(name);}if(successor34){window.__AW_V21_CANONICAL_FRAME__=draw;draw=()=>{};for(const name of ['modules/render/graybox-scene-painter.js','modules/interaction/resource-work.js','prototypes/successor-3-4/camera-adapter.js','modules/render/defense-structure-render-v1.js','modules/ui/route-guidance-v1.js','prototypes/successor-3-4/successor-renderer.js'])await loadModule(name);}BOOT.depsReady=true;BOOT.depsLoading=false;BOOT.promise=null;handoff();return true;}catch(error){console.error('[Abyssal V21 boot]',error);BOOT.depsReady=false;BOOT.depsLoading=false;BOOT.promise=null;BOOT.requested=false;setEnterBusy(false);setStatus('多人世界连接失败。请点击【进入安全营地】重试。',true);return false;}})();return BOOT.promise;}
function requestEntry(event){if(BOOT.depsReady)return;event?.preventDefault?.();event?.stopImmediatePropagation?.();BOOT.requested=true;setEnterBusy(true);setStatus(BOOT.depsLoading?'正在加载游戏系统…':'正在准备高质量安全营地…');loadModules();}
function onPointer(event){BOOT.lastPointerUpAt=performance.now();requestEntry(event);}
function onClick(event){if(performance.now()-BOOT.lastPointerUpAt<650){if(!BOOT.depsReady){event.preventDefault();event.stopImmediatePropagation();}return;}requestEntry(event);}
function onKey(event){if(event.key==='Enter')requestEntry(event);}
async function mountUI(){try{const response=await fetch('./ui-shell.html?ui='+VER,{cache:'no-store'});if(!response.ok)throw new Error('ui-shell.html '+response.status);const source=await response.text();const parsed=new DOMParser().parseFromString(source,'text/html');parsed.querySelectorAll('script').forEach(n=>n.remove());for(const style of parsed.head.querySelectorAll('style'))document.head.appendChild(style.cloneNode(true));document.body.innerHTML=parsed.body.innerHTML;const brand=document.querySelector('.brand');if(brand)brand.innerHTML='ABYSSAL WAKE<span>深渊苏醒</span>';const sub=document.querySelector('.subtitle');if(sub)sub.innerHTML='现代废墟之上的求生营地<br>准备、结伴、探索，然后平安归来';const input=document.getElementById('name');if(input)input.placeholder='幸存者名字';const btn=document.getElementById('enter');if(btn)btn.textContent='进入安全营地';const note=document.querySelector('.gate .note');if(note)note.textContent='当前可用：公网实时营地 · SafeCamp 安全区域';enter=btn;nameInput=input;const gate=document.getElementById('gate');if(!enter||!gate)throw new Error('entry DOM missing after UI mount');enter.addEventListener('pointerup',onPointer,{capture:true,passive:false});enter.addEventListener('click',onClick,{capture:true,passive:false});nameInput?.addEventListener('keydown',onKey,{capture:true});setTimeout(()=>{if(!BOOT.depsReady&&!BOOT.depsLoading)loadModules();},300);}catch(error){console.error('[Abyssal V21 UI]',error);failScreen('安全营地界面加载失败');}}
mountUI();
})();
</script>
</body>
