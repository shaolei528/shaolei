<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#17382f">
<title>深渊苏醒 — V21 Terrain Slice</title>
<style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#07110f;color:#dce9e1;font:700 11px ui-monospace,monospace}.boot{padding:18px;border:1px solid #607b6e;background:#0d1b17;text-align:center;line-height:1.7;max-width:82%}.boot small{color:#a9bbb2;font-weight:500}</style>
</head>
<body>
<div class="boot" id="boot">正在加载高质量安全营地…<br><small>64×64 像素地表 · 独立碰撞层 · 公网多人世界。</small></div>
<script>
let connectGlobal=async()=>null,switchZone=async()=>null;
(()=>{
'use strict';
const VER='21c';
const BOOT={depsReady:false,depsLoading:false,requested:false,promise:null,lastPointerUpAt:0,timeoutMs:8000};
window.ABYSSAL_BOOT_V21=BOOT;
const boot=document.getElementById('boot');
let enter=null,nameInput=null;
function failScreen(text){if(boot)boot.innerHTML=text+'<br><small>请重新载入一次；如果仍失败，把截图发给我。</small>';}
function loadScript(src,timeoutMs=BOOT.timeoutMs){return new Promise((resolve,reject)=>{const s=document.createElement('script');let settled=false;const timer=setTimeout(()=>done(false,new Error('timeout: '+src)),timeoutMs);function done(ok,value){if(settled)return;settled=true;clearTimeout(timer);s.onload=s.onerror=null;if(ok)resolve(value);else{s.remove();reject(value);}}s.src=src;s.async=false;s.onload=()=>done(true,src);s.onerror=()=>done(false,new Error('failed: '+src));document.head.appendChild(s);});}
function setStatus(text,error=false){const el=document.getElementById('setup');if(!el)return;el.classList.remove('hidden');el.textContent=text;el.style.color=error?'#efb1aa':'';}
function setEnterBusy(busy){const el=document.getElementById('enter');if(!el)return;if(!el.dataset.v21Label)el.dataset.v21Label=el.textContent;el.disabled=!!busy;el.textContent=busy?'正在进入营地…':el.dataset.v21Label;el.style.opacity=busy?'.78':'';}
async function ensureRealtime(){if(!window.ABYSSAL_CONFIG?.RELAY_URL)throw new Error('Cloudflare relay URL is not configured');setStatus('正在准备公网多人中继…');}
function removeInterceptors(){if(!enter)return;enter.removeEventListener('pointerup',onPointer,true);enter.removeEventListener('click',onClick,true);nameInput?.removeEventListener('keydown',onKey,true);}
function handoff(){if(!BOOT.depsReady)return;removeInterceptors();setEnterBusy(false);document.getElementById('setup')?.classList.add('hidden');if(BOOT.requested){BOOT.requested=false;queueMicrotask(()=>enter?.click());}}
async function loadModules(){if(BOOT.depsReady)return true;if(BOOT.promise)return BOOT.promise;BOOT.promise=(async()=>{BOOT.depsLoading=true;try{if(!window.ABYSSAL_CONFIG)await loadScript('./survival-config.js?v='+VER,5000);await ensureRealtime();const files=['modules/core/runtime-state.js','modules/ui/base-ui.js','modules/world/world-state.js','modules/world/world-spatial-v1.js','modules/network/session-zone.js','modules/network/inbound-events.js','modules/network/outbound-sync.js','modules/network/chat-sync.js','modules/safe-camp/base-interactions.js','modules/combat/player-combat.js','modules/survival/lifecycle.js','modules/input/joystick.js','modules/survival/status.js','modules/main-loop/simulation-update.js','modules/combat/mob-combat.js','modules/survival/day-night.js','modules/render/base-renderer.js','modules/main-loop/legacy-scheduler.js','modules/safe-camp/game-v7-patch.js','modules/input/mobile-fixes.js','modules/network/network-v9.js','modules/survival/gameplay-v9.js','modules/safe-camp/content-v9.js','terrain-v21.js','modules/render/render-v9.js','modules/core/optimize-v9.js','modules/ui/ux-cn-v11.js','modules/input/interaction-v12.js','modules/input/platform-inventory-v19.js','modules/network/network-relay-v16.js','modules/network/network-quality-v20.js','modules/render/awakening-art-assets-v1.js','modules/world/awakening-world-v1.js','modules/main-loop/smooth-motion-v18.js','modules/ui/regression-v14.js','modules/ui/game-shell-v1.js','modules/combat/hit-feedback.js','modules/combat/weapon-presentation-v1.js','modules/combat/playable-feel-v1.js','modules/audio/playable-feel-audio-v1.js','modules/core/dev-performance-v1.js'];for(const name of files){setStatus('正在加载游戏系统…');await loadScript('./'+name+'?v='+VER,8000);}BOOT.depsReady=true;BOOT.depsLoading=false;BOOT.promise=null;handoff();return true;}catch(error){console.error('[Abyssal V21 boot]',error);BOOT.depsReady=false;BOOT.depsLoading=false;BOOT.promise=null;BOOT.requested=false;setEnterBusy(false);setStatus('多人世界连接失败。请点击【进入安全营地】重试。',true);return false;}})();return BOOT.promise;}
function requestEntry(event){if(BOOT.depsReady)return;event?.preventDefault?.();event?.stopImmediatePropagation?.();BOOT.requested=true;setEnterBusy(true);setStatus(BOOT.depsLoading?'正在加载游戏系统…':'正在准备高质量安全营地…');loadModules();}
function onPointer(event){BOOT.lastPointerUpAt=performance.now();requestEntry(event);}
function onClick(event){if(performance.now()-BOOT.lastPointerUpAt<650){if(!BOOT.depsReady){event.preventDefault();event.stopImmediatePropagation();}return;}requestEntry(event);}
function onKey(event){if(event.key==='Enter')requestEntry(event);}
async function mountUI(){try{const response=await fetch('./survival-v7.html?ui='+VER,{cache:'no-store'});if(!response.ok)throw new Error('survival-v7.html '+response.status);const source=await response.text();const parsed=new DOMParser().parseFromString(source,'text/html');parsed.querySelectorAll('script').forEach(n=>n.remove());for(const style of parsed.head.querySelectorAll('style'))document.head.appendChild(style.cloneNode(true));document.body.innerHTML=parsed.body.innerHTML;const brand=document.querySelector('.brand');if(brand)brand.innerHTML='ABYSSAL WAKE<span>深渊苏醒</span>';const sub=document.querySelector('.subtitle');if(sub)sub.innerHTML='现代废墟之上的求生营地<br>准备、结伴、探索，然后平安归来';const input=document.getElementById('name');if(input)input.placeholder='幸存者名字';const btn=document.getElementById('enter');if(btn)btn.textContent='进入安全营地';const note=document.querySelector('.gate .note');if(note)note.textContent='当前可用：公网实时营地 · SafeCamp 安全区域';enter=btn;nameInput=input;const gate=document.getElementById('gate');if(!enter||!gate)throw new Error('entry DOM missing after UI mount');enter.addEventListener('pointerup',onPointer,{capture:true,passive:false});enter.addEventListener('click',onClick,{capture:true,passive:false});nameInput?.addEventListener('keydown',onKey,{capture:true});setTimeout(()=>{if(!BOOT.depsReady&&!BOOT.depsLoading)loadModules();},300);}catch(error){console.error('[Abyssal V21 UI]',error);failScreen('安全营地界面加载失败');}}
mountUI();
})();
</script>
</body>
</html>
